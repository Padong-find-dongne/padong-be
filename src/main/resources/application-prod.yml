spring:
  application:
    name: padong-be

  datasource:
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

swagger-config:
  server-url: "http://3.39.234.97:8080"

open-search:
  url: ${OPEN_SEARCH_URL}

  iam:
    region: ${OS_IAM_REGION}
    access-key: ${OS_IAM_ACCESS_KEY_ID}
    secret-key: ${OS_IAM_SECRET_ACCESS_KEY}
    session-token: ${OS_IAM_SESSION_TOKEN}
